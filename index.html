<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="HealthQuest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0f0d">
<meta name="application-name" content="HealthQuest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>HealthQuest</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#0a0f0d;--bg2:#111a16;--bg3:#1a2b23;--bg4:#243a30;
--green:#00e676;--green2:#69f0ae;--green3:#1b4332;--green4:#2d6a4f;
--gold:#ffd600;--gold2:#ffab00;--orange:#ff6d00;--red:#ff1744;
--blue:#448aff;--purple:#b388ff;--cyan:#18ffff;
--text:#e0e0e0;--text2:#9e9e9e;--text3:#616161;
--border:#2a3d33;
--safe-bottom:env(safe-area-inset-bottom,0px);
--safe-top:env(safe-area-inset-top,0px);
}
html,body{overscroll-behavior:none}
body{font-family:-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;padding-bottom:calc(72px + var(--safe-bottom))}

/* TOP BAR */
.topbar{position:fixed;top:0;left:0;right:0;padding-top:var(--safe-top);background:var(--bg2);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;height:calc(56px + var(--safe-top));padding-left:16px;padding-right:16px}
.topbar-title{font-size:18px;font-weight:800;color:var(--green)}
.topbar-title span{color:var(--gold)}
.topbar-streak{margin-left:auto;font-size:13px;font-weight:700;color:var(--orange)}
.topbar-level{font-size:12px;font-weight:700;color:var(--gold);margin-left:12px;background:var(--bg3);padding:4px 10px;border-radius:6px}

/* BOTTOM NAV */
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);display:flex;z-index:100;padding-bottom:var(--safe-bottom);height:calc(72px + var(--safe-bottom))}
.bottomnav-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0;cursor:pointer;transition:all .15s;position:relative;-webkit-tap-highlight-color:transparent}
.bottomnav-item:active{transform:scale(.92)}
.bottomnav-icon{font-size:22px;line-height:1;margin-bottom:2px}
.bottomnav-label{font-size:9px;font-weight:600;color:var(--text3);letter-spacing:.3px}
.bottomnav-item.active .bottomnav-label{color:var(--green)}
.bottomnav-item.active::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2px;background:var(--green);border-radius:0 0 2px 2px}

/* MAIN */
.main{margin-top:calc(56px + var(--safe-top));padding:16px;max-width:600px;margin-left:auto;margin-right:auto}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:16px}
.card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.card-subtitle{font-size:12px;color:var(--text2);font-weight:400;margin-left:auto}

/* XP BAR */
.xp-hero{text-align:center;padding:24px 20px}
.xp-level{font-size:48px;font-weight:900;color:var(--gold);text-shadow:0 0 30px rgba(255,214,0,.2);line-height:1}
.xp-rank{font-size:14px;color:var(--text2);margin-top:4px;font-weight:600}
.xp-bar-wrap{margin-top:16px}
.xp-bar-label{display:flex;justify-content:space-between;font-size:12px;color:var(--text2);margin-bottom:6px}
.xp-bar-bg{width:100%;height:12px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--border)}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--green3),var(--green));border-radius:6px;transition:width .6s cubic-bezier(.22,1,.36,1)}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--bg3);border-radius:12px;padding:14px 8px;text-align:center}
.stat-val{font-size:24px;font-weight:800}
.stat-val.g{color:var(--green)}.stat-val.o{color:var(--gold)}.stat-val.b{color:var(--blue)}
.stat-val.p{color:var(--purple)}.stat-val.c{color:var(--cyan)}
.stat-lbl{font-size:10px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:.5px}

/* HABITS */
.habit{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:all .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.habit:active{transform:scale(.98)}
.habit.done{border-color:var(--green4);background:rgba(0,230,118,.06)}
.habit-chk{width:32px;height:32px;border-radius:10px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .15s;flex-shrink:0}
.habit.done .habit-chk{background:var(--green);border-color:var(--green);color:var(--bg)}
.habit-info{flex:1;min-width:0}
.habit-name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.habit-desc{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.habit-xp{font-size:12px;font-weight:700;color:var(--gold);white-space:nowrap;flex-shrink:0}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach{padding:14px 8px;border-radius:12px;background:var(--bg);border:1px solid var(--border);text-align:center;transition:all .3s;overflow:hidden}
.ach.unlocked{border-color:var(--gold);background:rgba(255,214,0,.04)}
.ach-ico{font-size:32px;filter:grayscale(1) opacity(.25)}.ach.unlocked .ach-ico{filter:none}
.ach-nm{font-size:11px;font-weight:700;margin-top:6px;line-height:1.2}
.ach-ds{font-size:9px;color:var(--text3);margin-top:3px;line-height:1.3}
.ach-dt{font-size:9px;color:var(--gold);margin-top:4px;font-weight:600}

/* CHART */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bar-lbl{width:36px;font-size:12px;color:var(--text2);text-align:right;flex-shrink:0;font-weight:600}
.bar-bg{flex:1;height:24px;background:var(--bg);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;transition:width .5s ease}
.bar-val{width:24px;font-size:13px;font-weight:700}

/* INPUTS */
.inp-group{margin-bottom:14px}
.inp-group label{display:block;font-size:11px;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.inp-group input,.inp-group select,.inp-group textarea{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:16px;font-family:inherit;-webkit-appearance:none}
.inp-group input:focus,.inp-group select:focus,.inp-group textarea:focus{outline:none;border-color:var(--green)}
.inp-group textarea{resize:vertical;min-height:70px;font-size:15px}
.inp-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* BUTTONS */
.btn{padding:14px 24px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;width:100%;display:block;text-align:center;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--green);color:var(--bg)}
.btn-secondary{background:var(--bg3);color:var(--text);border:1px solid var(--border)}
.btn-gold{background:var(--gold);color:var(--bg)}
.btn-sm{padding:10px 16px;font-size:13px;width:auto;display:inline-block}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1;min-width:0}

/* RATING */
.rating{display:flex;gap:6px;flex-wrap:wrap}
.rating-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-weight:700;cursor:pointer;transition:all .15s;font-size:15px}
.rating-btn:active{transform:scale(.9)}
.rating-btn.selected{background:var(--green);color:var(--bg);border-color:var(--green)}

/* DATE NAV */
.date-nav{display:flex;align-items:center;gap:10px;margin-bottom:16px;justify-content:center}
.date-nav button{background:var(--bg3);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:10px;cursor:pointer;font-size:18px}
.date-nav button:active{background:var(--bg4)}
.date-display{font-size:14px;font-weight:700;color:var(--green2);text-align:center;min-width:0;flex-shrink:1}
.today-tag{font-size:10px;background:var(--green);color:var(--bg);padding:3px 8px;border-radius:5px;font-weight:700;flex-shrink:0}

/* TABLE */
.log-table{width:100%;border-collapse:separate;border-spacing:0;font-size:12px}
.log-table th{background:var(--bg3);padding:10px 8px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.3px;color:var(--text2);border-bottom:1px solid var(--border);white-space:nowrap}
.log-table td{padding:10px 8px;border-bottom:1px solid var(--border);font-size:13px}
.log-table tr:active td{background:var(--bg3)}

/* GUIDE */
.guide-section{margin-bottom:16px}
.guide-section h3{font-size:15px;color:var(--green);margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.guide-section p{font-size:14px;line-height:1.7;color:var(--text2);margin-bottom:10px}
.guide-section ul{margin:8px 0 14px 18px;color:var(--text2);font-size:13px;line-height:1.8}
.guide-tip{background:var(--bg3);border-left:3px solid var(--green);padding:12px 14px;border-radius:0 10px 10px 0;margin:10px 0;font-size:13px;color:var(--text2);line-height:1.6}

/* RECIPE CARDS */
.recipe{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px;border-left:3px solid var(--green)}
.recipe-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.recipe-name{font-weight:700;font-size:14px}
.recipe-tag{font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--bg3)}
.recipe-desc{font-size:12px;color:var(--text2);line-height:1.5}
.recipe-time{font-size:11px;color:var(--text3);margin-top:4px}

/* MEAL TABLE */
.meal-row{display:flex;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);align-items:center}
.meal-day{font-weight:700;font-size:13px;width:36px;flex-shrink:0;color:var(--green2)}
.meal-inputs{flex:1;display:flex;flex-direction:column;gap:4px}
.meal-input{background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 8px;color:var(--text);font-size:13px;font-family:inherit;width:100%}
.meal-input:focus{outline:none;border-color:var(--green)}
.meal-input::placeholder{color:var(--text3);font-size:12px}

/* POPUPS */
.xp-popup{position:fixed;top:calc(64px + var(--safe-top));right:16px;background:var(--bg2);border:2px solid var(--gold);border-radius:12px;padding:10px 18px;font-weight:700;color:var(--gold);font-size:16px;z-index:200;animation:popIn .3s ease,popOut .3s ease 1.2s forwards;pointer-events:none}
@keyframes popIn{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes popOut{from{opacity:1}to{opacity:0;transform:translateY(-16px)}}
.toast{position:fixed;bottom:calc(80px + var(--safe-bottom));left:16px;right:16px;background:var(--green3);border:1px solid var(--green);color:var(--green2);padding:14px 20px;border-radius:14px;font-size:14px;font-weight:600;z-index:300;text-align:center;animation:slideUp .3s ease;display:none}
.toast.show{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

/* SCROLL HORIZONTAL HELPER */
.h-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none}
.h-scroll::-webkit-scrollbar{display:none}

/* PSL */
.psl-score-display{text-align:center;padding:20px 0}
.psl-score-big{font-size:64px;font-weight:900;line-height:1}
.psl-score-label{font-size:14px;color:var(--text2);margin-top:4px}
.psl-tier{display:inline-block;padding:4px 14px;border-radius:8px;font-size:13px;font-weight:700;margin-top:8px}
.psl-category{margin-bottom:16px}
.psl-cat-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.psl-cat-name{font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
.psl-cat-score{font-size:13px;font-weight:700}
.psl-q{margin-bottom:12px}
.psl-q-label{font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.psl-q-desc{font-size:11px;color:var(--text3);margin-bottom:6px;line-height:1.4}
.psl-opts{display:flex;gap:4px;flex-wrap:wrap}
.psl-opt{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text2);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;flex:1;text-align:center;min-width:0}
.psl-opt:active{transform:scale(.95)}
.psl-opt.sel{background:var(--green);color:var(--bg);border-color:var(--green)}
.psl-meter{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
.psl-meter-fill{height:100%;border-radius:4px;transition:width .4s ease}
.psl-improve{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:8px}
.psl-improve-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.psl-improve-pri{font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;text-transform:uppercase}
.psl-improve-title{font-size:14px;font-weight:700}
.psl-improve-body{font-size:13px;color:var(--text2);line-height:1.6}
.psl-history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border)}
.psl-history-date{font-size:13px;color:var(--text2)}
.psl-history-score{font-size:18px;font-weight:800}

/* DESKTOP */
@media(min-width:700px){
  .main{max-width:600px;padding:20px}
  .stats-grid{grid-template-columns:repeat(3,1fr)}
  .ach-grid{grid-template-columns:repeat(4,1fr)}
  .bottomnav{max-width:600px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0;border-left:1px solid var(--border);border-right:1px solid var(--border)}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">Health<span>Quest</span></div>
  <div class="topbar-streak" id="topStreak">🔥 0</div>
  <div class="topbar-level" id="topLevel">Lv.1</div>
</div>

<div class="main" id="app"></div>

<nav class="bottomnav" id="bottomNav"></nav>
<div class="toast" id="toast"></div>

<script>
// ====== DATA ======
const SK='healthquest_v3';
const TODAY=()=>new Date().toISOString().slice(0,10);
const LEVELS=[
  {n:'Novice',x:0},{n:'Beginner',x:200},{n:'Apprentice',x:500},{n:'Warrior',x:1000},
  {n:'Champion',x:2000},{n:'Elite',x:3500},{n:'Master',x:5500},{n:'Grandmaster',x:8000},
  {n:'Legend',x:12000},{n:'Mythic',x:18000},{n:'Transcendent',x:25000}
];
const DEFAULT_HABITS=[
  {id:'water',name:'Hydrate (80+ oz)',desc:'Drink water throughout the day',xp:15,icon:'💧'},
  {id:'no_alcohol',name:'Alcohol-Free Day',desc:'Stay strong on your sobriety journey',xp:25,icon:'🛡️'},
  {id:'sunlight',name:'Morning Sunlight',desc:'10+ min outside within first hour',xp:15,icon:'☀️'},
  {id:'exercise',name:'Exercise / Gym',desc:'Walk, gym, stretch — any movement',xp:30,icon:'💪'},
  {id:'home_meal',name:'Home-Cooked Meal',desc:'Cook at least one meal today',xp:20,icon:'🍳'},
  {id:'skincare_am',name:'Morning Skincare',desc:'Cleanse, treat, moisturize, SPF',xp:10,icon:'✨'},
  {id:'skincare_pm',name:'Evening Skincare',desc:'Cleanse, treat, moisturize',xp:10,icon:'🌙'},
  {id:'supplements',name:'Supplements Taken',desc:'Take your daily supplement stack',xp:15,icon:'💊'},
  {id:'sleep_quality',name:'Good Sleep (7-9 hrs)',desc:'Quality rest, consistent schedule',xp:20,icon:'😴'},
  {id:'no_doorDash',name:'No DoorDash Today',desc:'Save money, eat cleaner',xp:20,icon:'🚫'},
  {id:'cold_water_face',name:'Face De-Bloat Routine',desc:'Cold water + lymphatic massage',xp:10,icon:'🧊'},
  {id:'protein_breakfast',name:'Protein Breakfast',desc:'Eggs, smoothie, or oats within 90 min',xp:15,icon:'🥚'},
];
function getHabits(){return D.customHabits||DEFAULT_HABITS}
const ACHS=[
  {id:'first_day',n:'Day One',d:'Complete your first check-in',i:'🌱',c:s=>s.tl>=1},
  {id:'week_one',n:'Full Week',d:'Log habits for 7 days',i:'📅',c:s=>s.tl>=7},
  {id:'month_one',n:'30 Day Warrior',d:'Log for 30 days',i:'⚔️',c:s=>s.tl>=30},
  {id:'streak_3',n:'On Fire',d:'3-day streak',i:'🔥',c:s=>s.bs>=3},
  {id:'streak_7',n:'Unstoppable',d:'7-day streak',i:'💥',c:s=>s.bs>=7},
  {id:'streak_14',n:'Two Weeks Strong',d:'14-day streak',i:'⚡',c:s=>s.bs>=14},
  {id:'streak_30',n:'Legendary Streak',d:'30-day streak',i:'👑',c:s=>s.bs>=30},
  {id:'sober_7',n:'Clear Mind',d:'7 days alcohol-free',i:'🧠',c:s=>s.sd>=7},
  {id:'sober_30',n:'Sober Month',d:'30 days sober',i:'🏆',c:s=>s.sd>=30},
  {id:'sober_90',n:'Quarter Year Clean',d:'90 days sober',i:'💎',c:s=>s.sd>=90},
  {id:'gym_10',n:'Gym Rat',d:'10 gym sessions',i:'🏋️',c:s=>s.gs>=10},
  {id:'gym_30',n:'Iron Addict',d:'30 gym sessions',i:'🦾',c:s=>s.gs>=30},
  {id:'cook_20',n:'Home Chef',d:'20 home meals',i:'👨‍🍳',c:s=>s.hm>=20},
  {id:'cook_50',n:'Master Chef',d:'50 home meals',i:'🍽️',c:s=>s.hm>=50},
  {id:'perfect_day',n:'Perfect Day',d:'All habits in one day',i:'⭐',c:s=>s.pd>=1},
  {id:'perfect_week',n:'Perfect Week',d:'7 perfect days straight',i:'🌟',c:s=>s.ps>=7},
  {id:'level_5',n:'Getting Serious',d:'Reach Level 5',i:'🎖️',c:s=>s.lv>=5},
  {id:'level_8',n:'Grandmaster',d:'Reach Level 8',i:'🏅',c:s=>s.lv>=8},
  {id:'first_checkin',n:'Self-Aware',d:'First weekly check-in',i:'📊',c:s=>s.wc>=1},
  {id:'first_workout',n:'Logged & Loaded',d:'First gym workout',i:'📝',c:s=>s.gs>=1},
];

function load(){try{const r=localStorage.getItem(SK);return r?JSON.parse(r):{xp:0,days:{},gym:[],wk:[],ach:{},sd:'2026-03-25',sel:TODAY(),mp:{}}}catch(e){return{xp:0,days:{},gym:[],wk:[],ach:{},sd:'2026-03-25',sel:TODAY(),mp:{}}}}
function save(){localStorage.setItem(SK,JSON.stringify(D))}
// Migrate from v2
(function migrate(){try{const v2=localStorage.getItem('healthquest_v2');if(v2&&!localStorage.getItem(SK)){const o=JSON.parse(v2);const n={xp:o.xp||0,days:o.days||{},gym:o.gymLog||[],wk:o.weeklyCheckins||[],ach:o.achievements||{},sd:o.startDate||'2026-03-25',sel:o.selectedDate||TODAY(),mp:o.mealPlan||{}};localStorage.setItem(SK,JSON.stringify(n))}}catch(e){}})();
let D=load();

function getDay(d){if(!D.days[d])D.days[d]={h:{},s:{},notes:''};return D.days[d]}

function stats(){
  const days=Object.keys(D.days);
  let tl=days.filter(d=>{const h=D.days[d].h;return h&&Object.values(h).some(v=>v)}).length;
  let sd=0,cs=0,bs=0,pd=0,ps=0,cp=0,hm=0,gs=0;
  const start=new Date(D.sd||'2026-03-25'),today=new Date(TODAY());
  const diff=Math.floor((today-start)/864e5)+1;
  let allSober=true;
  for(let i=0;i<diff;i++){
    const dt=new Date(start);dt.setDate(dt.getDate()+i);
    const ds=dt.toISOString().slice(0,10),day=D.days[ds];
    if(day&&day.h&&day.h.no_alcohol===false){allSober=false;sd=0}
    else if(allSober||(day&&day.h&&day.h.no_alcohol)){sd++}
  }
  let prev=null;
  days.sort().forEach(ds=>{
    const day=D.days[ds];if(!day.h)return;
    const done=Object.values(day.h).filter(v=>v).length;
    if(done>0){
      if(prev){const df=(new Date(ds)-new Date(prev))/864e5;if(df===1)cs++;else cs=1}else cs=1;
      bs=Math.max(bs,cs);prev=ds;
    }
    if(done===getHabits().length){pd++;cp++;ps=Math.max(ps,cp)}else cp=0;
    if(day.h.home_meal)hm++;if(day.h.exercise)gs++;
  });
  gs+=D.gym.length;
  const lv=LEVELS.reduce((l,v,i)=>D.xp>=v.x?i:l,0);
  return{tl,sd,cs,bs,pd,ps,hm,gs,lv,wc:D.wk.length}
}

function addXP(n){
  const ol=LEVELS.reduce((l,v,i)=>D.xp>=v.x?i:l,0);
  D.xp+=n;
  const nl=LEVELS.reduce((l,v,i)=>D.xp>=v.x?i:l,0);
  save();updateTopBar();
  if(nl>ol)toast(`🎉 LEVEL UP! You're now a ${LEVELS[nl].n}!`);
  xpPop(`+${n} XP`);
}

let pslModelsLoaded=false,pslAnalyzing=false;

async function loadPSLModels(){
  if(pslModelsLoaded)return true;
  try{
    const MODEL_URL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';
    await Promise.all([
      faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
      faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
    ]);
    pslModelsLoaded=true;return true;
  }catch(e){console.error('Model load error:',e);return false}
}

// Landmark indices (68-point model)
// Jaw: 0-16, L-brow: 17-21, R-brow: 22-26, Nose bridge: 27-30, Nose bottom: 31-35
// L-eye: 36-41 (36=outer,39=inner), R-eye: 42-47 (42=inner,45=outer)
// Outer lip: 48-59, Inner lip: 60-67

function dist(a,b){return Math.sqrt((a.x-b.x)**2+(a.y-b.y)**2)}
function midpoint(a,b){return{x:(a.x+b.x)/2,y:(a.y+b.y)/2}}
function angle(from,to){return Math.atan2(to.y-from.y,to.x-from.x)*180/Math.PI}

function analyzeFace(landmarks){
  const p=landmarks.positions;
  const metrics={};

  // ---- FWHR (Face Width to Height Ratio) ----
  // Width: across cheekbones (point 1 to 15)
  // Height: brow line (mid of 19,24) to upper lip (51)
  const faceW=dist(p[1],p[15]);
  const browMid=midpoint(p[19],p[24]);
  const faceH=dist(browMid,p[51]);
  metrics.fwhr={value:Math.round(faceW/faceH*100)/100,ideal:'1.90-2.05',name:'Face Width-Height Ratio',
    score:scoreRange(faceW/faceH,1.9,2.05,0.3)};

  // ---- Canthal Tilt ----
  const lCanthal=angle(p[39],p[36]); // inner to outer, left eye
  const rCanthal=angle(p[42],p[45]); // inner to outer, right eye
  const avgCanthal=Math.round(((lCanthal+rCanthal)/2)*10)/10;
  // For male PSL, positive tilt (3-7°) is ideal
  metrics.canthalTilt={value:avgCanthal+'°',ideal:'+3° to +7°',name:'Canthal Tilt',
    score:scoreRange(-avgCanthal,3,7,5)}; // negative because upward = negative in screen coords

  // ---- Facial Thirds ----
  // Upper: top of face (approx from brow + forehead estimate) to brow
  // We estimate forehead top as brow point mirrored above by ~same distance as brow-to-nose
  const browLine=(p[19].y+p[24].y)/2;
  const noseBase=p[33].y;
  const chin=p[8].y;
  const foreheadEst=browLine-(noseBase-browLine)*0.85; // estimate
  const upper=browLine-foreheadEst;
  const middle=noseBase-browLine;
  const lower=chin-noseBase;
  const totalFace=upper+middle+lower;
  const upperPct=Math.round(upper/totalFace*100);
  const middlePct=Math.round(middle/totalFace*100);
  const lowerPct=Math.round(lower/totalFace*100);
  // Ideal is roughly equal thirds (33/33/33)
  const thirdsDev=Math.abs(upperPct-33)+Math.abs(middlePct-33)+Math.abs(lowerPct-33);
  metrics.facialThirds={value:`${upperPct}/${middlePct}/${lowerPct}`,ideal:'33/33/33',name:'Facial Thirds',
    score:Math.max(0,Math.min(100,100-thirdsDev*2.5))};

  // ---- Midface Ratio ----
  const eyeCenterL=midpoint(p[36],p[39]);
  const eyeCenterR=midpoint(p[42],p[45]);
  const ipd=dist(eyeCenterL,eyeCenterR);
  const midfaceH=dist(midpoint(eyeCenterL,eyeCenterR),p[51]);
  const mfr=Math.round(ipd/midfaceH*100)/100;
  metrics.midfaceRatio={value:mfr,ideal:'0.95-1.0',name:'Midface Ratio',
    score:scoreRange(mfr,0.95,1.0,0.2)};

  // ---- Jaw Width vs Cheekbone Width ----
  const jawW=dist(p[5],p[11]);
  const cheekW=dist(p[1],p[15]);
  const jawRatio=Math.round(jawW/cheekW*100)/100;
  metrics.jawWidth={value:jawRatio,ideal:'0.75-0.85',name:'Jaw-to-Cheekbone Ratio',
    score:scoreRange(jawRatio,0.75,0.85,0.2)};

  // ---- Facial Symmetry ----
  const center=midpoint(p[27],p[8]); // nose bridge top to chin center
  const centerX=(p[27].x+p[8].x)/2;
  let symTotal=0,symCount=0;
  const symPairs=[[0,16],[1,15],[2,14],[3,13],[4,12],[5,11],[17,26],[18,25],[19,24],[20,23],[21,22],[36,45],[37,44],[38,43],[39,42],[40,47],[41,46],[31,35],[32,34],[48,54],[49,53],[50,52],[55,59],[56,58]];
  symPairs.forEach(([l,r])=>{
    const dl=Math.abs(p[l].x-centerX);
    const dr=Math.abs(p[r].x-centerX);
    const max=Math.max(dl,dr);
    if(max>0){symTotal+=Math.min(dl,dr)/max;symCount++}
  });
  const symScore=symCount>0?Math.round(symTotal/symCount*100):50;
  metrics.symmetry={value:symScore+'%',ideal:'95%+',name:'Facial Symmetry',score:Math.min(100,symScore)};

  // ---- Eye Spacing (ES/FW ratio) ----
  const esfw=Math.round(ipd/faceW*100)/100;
  metrics.eyeSpacing={value:esfw,ideal:'0.44-0.47',name:'Eye Spacing Ratio',
    score:scoreRange(esfw,0.44,0.47,0.08)};

  // ---- Nose Width Ratio ----
  const noseW=dist(p[31],p[35]);
  const nwRatio=Math.round(noseW/faceW*100)/100;
  metrics.noseWidth={value:nwRatio,ideal:'0.20-0.25',name:'Nose Width Ratio',
    score:scoreRange(nwRatio,0.20,0.25,0.08)};

  // ---- Lip Ratio ----
  const upperLip=dist(p[51],p[62]);
  const lowerLip=dist(p[57],p[66]);
  const lipR=Math.round(upperLip/lowerLip*100)/100;
  metrics.lipRatio={value:lipR,ideal:'0.40-0.60',name:'Upper-to-Lower Lip Ratio',
    score:scoreRange(lipR,0.40,0.60,0.3)};

  // ---- Gonial Angle Estimate ----
  // Angle at jaw corner: approximate from points 4/5 area
  const lJawAngle=angle(p[3],p[5])-angle(p[5],p[7]);
  const rJawAngle=angle(p[13],p[11])-angle(p[11],p[9]);
  const avgGonial=Math.round(Math.abs((lJawAngle+rJawAngle)/2)*10)/10;
  metrics.gonialAngle={value:avgGonial+'°',ideal:'115°-125°',name:'Gonial Angle (est.)',
    score:scoreRange(avgGonial,115,125,20)};

  // ---- Brow Height ----
  const lBrowH=dist(midpoint(p[19],p[20]),midpoint(p[37],p[38]));
  const rBrowH=dist(midpoint(p[23],p[24]),midpoint(p[43],p[44]));
  const browH=((lBrowH+rBrowH)/2);
  const browRatio=Math.round(browH/faceH*100)/100;
  metrics.browHeight={value:browRatio,ideal:'0.08-0.14',name:'Brow-to-Eye Distance',
    score:scoreRange(browRatio,0.08,0.14,0.08)};

  // Calculate overall PSL
  const weights={fwhr:1.2,canthalTilt:1.3,facialThirds:0.9,midfaceRatio:1.0,jawWidth:1.1,
    symmetry:1.4,eyeSpacing:0.7,noseWidth:0.6,lipRatio:0.5,gonialAngle:1.0,browHeight:0.7};
  let wSum=0,wTotal=0;
  Object.keys(metrics).forEach(k=>{
    const w=weights[k]||1;
    wSum+=metrics[k].score*w;
    wTotal+=w;
  });
  const rawPct=wSum/wTotal; // 0-100
  // Map percentage to PSL 1-7 range (realistic)
  const psl=Math.round((1+rawPct/100*6)*10)/10;

  return{psl:Math.min(psl,7.5),metrics,landmarks:p};
}

function scoreRange(val,idealLow,idealHigh,tolerance){
  if(val>=idealLow&&val<=idealHigh)return 100;
  const distFromIdeal=val<idealLow?idealLow-val:val-idealHigh;
  return Math.max(0,Math.min(100,100-distFromIdeal/tolerance*100));
}

    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch" class="h-scroll">
      ${frontPhotos.slice().reverse().slice(0,6).map(p=>`
        <div style="flex-shrink:0;text-align:center">
          <img src="${p.img}" style="width:80px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);margin-top:4px">${fmtDate(p.date)}</div>
        </div>
      `).join('')}
    </div>`:''}
    ${sidePhotos.length>0?`
    <div style="font-size:12px;font-weight:700;color:var(--green2);margin:${frontPhotos.length>0?'12px':'0'} 0 8px">Side Profile</div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch" class="h-scroll">
      ${sidePhotos.slice().reverse().slice(0,6).map(p=>`
        <div style="flex-shrink:0;text-align:center">
          <img src="${p.img}" style="width:80px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--border)">
          <div style="font-size:9px;color:var(--text3);margin-top:4px">${fmtDate(p.date)}</div>
        </div>
      `).join('')}
    </div>`:''}
    ${(frontPhotos.length>0||sidePhotos.length>0)?`<button class="btn btn-sm btn-secondary" style="margin-top:10px;color:var(--orange);font-size:11px" onclick="clearPhotos()">Clear All Photos</button>`:''}
  </div>`:''}

  ${lastResult?`
  <div class="card">
    <div class="card-title">📊 Last Analysis</div>
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:12px">
      <div>
        <div class="psl-score-big" style="color:${getPSLTier(lastResult.psl).c};font-size:48px">${lastResult.psl}</div>
        <div style="font-size:11px;color:var(--text2)">${fmtDate(lastResult.date)}</div>
      </div>
      <div class="psl-tier" style="color:${getPSLTier(lastResult.psl).c};background:${getPSLTier(lastResult.psl).bg}">${getPSLTier(lastResult.psl).n}</div>
    </div>
    ${lastResult.metrics?Object.entries(lastResult.metrics).map(([k,m])=>{
      const color=m.score>=80?'var(--green)':m.score>=50?'var(--gold)':m.score>=30?'var(--orange)':'var(--red)';
      return `<div class="bar-row"><div class="bar-lbl" style="width:90px;font-size:10px">${m.name.split(' ')[0]}</div><div class="bar-bg"><div class="bar-fill" style="width:${m.score}%;background:${color}"></div></div><div class="bar-val" style="color:${color};width:36px;font-size:11px">${Math.round(m.score)}</div></div>`;
    }).join(''):''}
  </div>`:''}

  ${pslData.assessments.length>1?`
  <div class="card">
    <div class="card-title">📈 Score History</div>
    ${pslData.assessments.slice().reverse().slice(0,10).map(a=>{
      const tier=getPSLTier(a.psl);
      return `<div class="psl-history-item">
        <div class="psl-history-date">${fmtDate(a.date)}</div>
        <div class="psl-history-score" style="color:${tier.c}">${a.psl}</div>
      </div>`;
    }).join('')}
  </div>`:''}

  <div class="guide-tip">
    <strong>Tips for best results:</strong><br>
    <strong>Front:</strong> Face camera straight on, neutral expression, even lighting, hair back.<br>
    <strong>Side:</strong> Turn 90°, keep chin level, show jaw and nose profile clearly.<br>
    Retake every 4-6 weeks to track changes from your health improvements.
  </div>`;
}

function handleSidePhoto(input){
  const file=input.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const pslData=getPSLData();
    if(!pslData.sidePhotos)pslData.sidePhotos=[];
    // Resize to thumbnail to save localStorage space
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      const maxDim=200;
      const scale=Math.min(maxDim/img.width,maxDim/img.height,1);
      canvas.width=img.width*scale;canvas.height=img.height*scale;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);
      const thumb=canvas.toDataURL('image/jpeg',0.7);
      pslData.sidePhotos.push({date:TODAY(),img:thumb});
      D.psl=pslData;save();
      toast('Side profile saved! 📐');render();
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function clearPhotos(){
  if(!confirm('Delete all saved photos from gallery?'))return;
  const pslData=getPSLData();
  pslData.frontPhotos=[];pslData.sidePhotos=[];
  D.psl=pslData;save();toast('Photos cleared');render();
}

async function handlePSLPhoto(input,photoType){
  const file=input.files[0];
  if(!file)return;
  if(pslAnalyzing)return;
  pslAnalyzing=true;

  const area=document.getElementById('pslAnalysisArea');
  area.innerHTML=`
  <div class="card" style="text-align:center;padding:30px">
    <div style="font-size:24px;margin-bottom:8px">🔍</div>
    <div style="font-size:14px;font-weight:600;color:var(--green2)" id="pslStatus">Loading AI models...</div>
    <div class="xp-bar-bg" style="margin-top:12px;height:8px"><div class="xp-bar-fill" id="pslProgress" style="width:20%;transition:width .5s"></div></div>
  </div>`;

  const loaded=await loadPSLModels();
  if(!loaded){
    area.innerHTML=`<div class="card" style="text-align:center;padding:20px;color:var(--red)">Failed to load AI models. Check your internet connection and try again.</div>`;
    pslAnalyzing=false;return;
  }
  document.getElementById('pslStatus').textContent='Analyzing your face...';
  document.getElementById('pslProgress').style.width='50%';

  const img=new Image();
  img.onload=async()=>{
    try{
      // Create canvas and draw image
      const canvas=document.createElement('canvas');
      const maxDim=640;
      const scale=Math.min(maxDim/img.width,maxDim/img.height,1);
      canvas.width=img.width*scale;
      canvas.height=img.height*scale;
      const ctx=canvas.getContext('2d');
      ctx.drawImage(img,0,0,canvas.width,canvas.height);

      document.getElementById('pslProgress').style.width='70%';

      // Detect face and landmarks
      const detection=await faceapi.detectSingleFace(canvas,new faceapi.TinyFaceDetectorOptions({inputSize:416,scoreThreshold:0.4})).withFaceLandmarks();

      if(!detection){
        area.innerHTML=`<div class="card" style="text-align:center;padding:20px">
          <div style="font-size:24px;margin-bottom:8px">😕</div>
          <div style="font-size:14px;color:var(--text2)">No face detected. Make sure your face is clearly visible, well-lit, and front-facing. Try another photo.</div>
        </div>`;
        pslAnalyzing=false;return;
      }

      document.getElementById('pslProgress').style.width='90%';

      // Analyze
      const result=analyzeFace(detection.landmarks);
      const tier=getPSLTier(result.psl);
      const imps=getMetricImprovements(result.metrics);

      // Draw landmarks on photo
      const displayCanvas=document.createElement('canvas');
      displayCanvas.width=canvas.width;displayCanvas.height=canvas.height;
      const dctx=displayCanvas.getContext('2d');
      dctx.drawImage(canvas,0,0);

      // Draw landmark points
      const pts=result.landmarks;
      dctx.fillStyle='rgba(0,230,118,0.6)';
      pts.forEach(p=>{dctx.beginPath();dctx.arc(p.x*scale,p.y*scale,2,0,Math.PI*2);dctx.fill()});

      // Draw key measurement lines
      dctx.strokeStyle='rgba(0,230,118,0.4)';dctx.lineWidth=1;dctx.setLineDash([4,4]);
      // FWHR width line
      dctx.beginPath();dctx.moveTo(pts[1].x*scale,pts[1].y*scale);dctx.lineTo(pts[15].x*scale,pts[15].y*scale);dctx.stroke();
      // Jaw line
      for(let i=0;i<16;i++){if(i===0){dctx.beginPath();dctx.moveTo(pts[i].x*scale,pts[i].y*scale)}else dctx.lineTo(pts[i].x*scale,pts[i].y*scale)}
      dctx.strokeStyle='rgba(255,214,0,0.4)';dctx.stroke();
      // Symmetry center line
      dctx.strokeStyle='rgba(68,138,255,0.3)';dctx.beginPath();
      const cx=(pts[27].x+pts[8].x)/2*scale;
      dctx.moveTo(cx,pts[27].y*scale-20);dctx.lineTo(cx,pts[8].y*scale+10);dctx.stroke();
      dctx.setLineDash([]);

      const imgDataUrl=displayCanvas.toDataURL('image/jpeg',0.9);

      // Save front profile thumbnail
      if(photoType==='front'){
        const thumbCanvas=document.createElement('canvas');
        const thumbScale=Math.min(200/img.width,200/img.height,1);
        thumbCanvas.width=img.width*thumbScale;thumbCanvas.height=img.height*thumbScale;
        const tctx=thumbCanvas.getContext('2d');
        tctx.drawImage(img,0,0,thumbCanvas.width,thumbCanvas.height);
        window._lastFrontThumb=thumbCanvas.toDataURL('image/jpeg',0.7);
      }

      // Store for save button
      window._lastPSLResult={psl:result.psl,metrics:result.metrics};

      // Render results
      area.innerHTML=`
      <div class="card" style="padding:16px;text-align:center">
        <img src="${imgDataUrl}" style="width:100%;max-width:400px;border-radius:12px;border:2px solid var(--border);margin-bottom:16px">
        <div class="psl-score-display">
          <div class="psl-score-big" style="color:${tier.c}">${result.psl}</div>
          <div class="psl-score-label">PSL Score</div>
          <div class="psl-tier" style="color:${tier.c};background:${tier.bg}">${tier.n}</div>
        </div>
        <div style="margin-top:14px"><button class="btn btn-gold" onclick="savePSLResult()">Save Analysis (+40 XP)</button></div>
      </div>

      <div class="card">
        <div class="card-title">📐 Measurements <span class="card-subtitle">68-point analysis</span></div>
        ${Object.entries(result.metrics).map(([k,m])=>{
          const color=m.score>=80?'var(--green)':m.score>=50?'var(--gold)':m.score>=30?'var(--orange)':'var(--red)';
          return `<div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:3px">
              <span style="font-weight:600">${m.name}</span>
              <span style="color:${color};font-weight:700">${m.value}</span>
            </div>
            <div class="psl-meter"><div class="psl-meter-fill" style="width:${m.score}%;background:${color}"></div></div>
            <div style="font-size:10px;color:var(--text3);margin-top:2px">Ideal: ${m.ideal}</div>
          </div>`;
        }).join('')}
      </div>

      ${imps.length>0?`
      <div class="card">
        <div class="card-title">🎯 Improvement Plan <span class="card-subtitle">Based on your weakest metrics</span></div>
        ${imps.map(imp=>{
          const priColor=imp.pri==='HIGH'?'var(--red)':imp.pri==='MED'?'var(--gold)':'var(--text3)';
          const priBg=imp.pri==='HIGH'?'rgba(255,23,68,.15)':imp.pri==='MED'?'rgba(255,214,0,.15)':'rgba(150,150,150,.1)';
          return `<div class="psl-improve">
            <div class="psl-improve-head">
              <span class="psl-improve-pri" style="color:${priColor};background:${priBg}">${imp.pri}</span>
              <span class="psl-improve-title">${imp.t}</span>
            </div>
            <div class="psl-improve-body">${imp.b}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:4px">For: ${imp.metric} (score: ${Math.round(imp.score)}%)</div>
          </div>`;
        }).join('')}
      </div>`:''}`;

      pslAnalyzing=false;
    }catch(e){
      console.error('Analysis error:',e);
      area.innerHTML=`<div class="card" style="text-align:center;padding:20px;color:var(--red)">Analysis error: ${e.message}. Try a different photo.</div>`;
      pslAnalyzing=false;
    }
  };
  img.onerror=()=>{
    area.innerHTML=`<div class="card" style="text-align:center;padding:20px;color:var(--red)">Could not load image. Try a different photo.</div>`;
    pslAnalyzing=false;
  };
  img.src=URL.createObjectURL(file);
}

function savePSLResult(){
  if(!window._lastPSLResult){toast('Analyze a photo first!');return}
  const{psl,metrics}=window._lastPSLResult;
  const pslData=getPSLData();
  pslData.assessments.push({date:TODAY(),psl,metrics});
  // Save front profile thumbnail to gallery
  if(window._lastFrontThumb){
    if(!pslData.frontPhotos)pslData.frontPhotos=[];
    pslData.frontPhotos.push({date:TODAY(),img:window._lastFrontThumb});
    window._lastFrontThumb=null;
  }
  D.psl=pslData;
  addXP(40);save();
  toast(`PSL ${psl} saved! +40 XP 📸`);
  window._lastPSLResult=null;
  render();
}

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
